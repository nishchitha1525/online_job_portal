<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
{% if messages %}
    {% for message in messages %}
        <div id="successMessage" style="
            background:#d4edda;
            color:#155724;
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
            text-align:center;
            font-weight:bold;">
            ✅ {{ message }}
        </div>
    {% endfor %}
{% endif %}
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            margin:0;
            padding:0;
        }

        .login-box{
            width:350px;
            margin:80px auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#007bff;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:20px;
            box-sizing:border-box;
        }

        .password-container{
            position:relative;
        }

        .toggle-password{
            position:absolute;
            right:12px;
            top:20px;
            cursor:pointer;
            font-size:20px;
        }

        button{
            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
            padding:10px;
            border-radius:5px;
            margin-bottom:15px;
            text-align:center;
        }

        p{
            text-align:center;
        }

        a{
            color:#007bff;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="login-box">

<h2>User Login</h2>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username" required>

    <div class="password-container">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
    </div>

    <button type="submit">Login</button>

    <p><a href="/forgot-password/">Forgot Password?</a></p>
</form>

<p>
    Don't have an account?
    <a href="/register/">Register</a>
</p>

</div>

<script>
function togglePassword() {
    var password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>
<script>
setTimeout(function () {
    var msg = document.getElementById("successMessage");
    if (msg) {
        msg.style.display = "none";
    }
}, 3000); // 3000 milliseconds = 3 seconds
</script>

</body>
</html>
