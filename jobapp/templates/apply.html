<!DOCTYPE html>
<html>
<head>
    <title>Apply for Job</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#007bff;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        .success{
            color:green;
            text-align:center;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Apply for Job</h2>

{% if message %}
<p class="success">{{ message }}</p>
{% endif %}

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<label>Full Name</label>
<input type="text" name="fullname" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Phone Number</label>
<input type="text" name="phone" required>

<label>Qualification</label>
<input type="text" name="qualification" required>

<label>Upload Resume</label>
<input type="file" name="resume" required>

<button type="submit">Apply Now</button>

</form>

</div>

</body>
</html>
